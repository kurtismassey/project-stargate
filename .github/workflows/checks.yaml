name: checks

permissions:
  contents: read
on:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: |
          cd frontend && npm install

      - name: Format frontend
        run: |
          cd frontend && npm run format

      - name: Lint frontend
        run: |
          cd frontend && npm run lint

      - name: Test frontend
        run: |
          cd frontend && npm run test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stargate
          POSTGRES_PASSWORD: stargate
          POSTGRES_DB: stargate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stargate -d stargate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv sync --group dev

      - name: Format backend
        run: |
          uv run ruff check backend/
          uv run ruff format backend/

      - name: Lint backend
        run: |
          uv run ruff check backend/
          uv run mypy backend/

      - name: Test backend
        env:
          STARGATE_PG_TEST_URL: postgresql+asyncpg://stargate:stargate@127.0.0.1:5432/stargate
        run: |
          cd backend && PYTHONPATH=. uv run pytest tests/ -v
