[tool.poetry]
name = "project-stargate"
version = "0.1.0"
description = "Project Stargate AI - Remote Viewing Platform"
authors = ["Kurtis Massey <55586356+kurtismassey@users.noreply.github.com>"]
readme = "README.md"
packages = [
    { include = "core" }
]

[tool.poetry.dependencies]
python = "^3.11"
langchain = "^0.2.12"
google-cloud-firestore = "^2.17.0"
langchain-google-firestore = "^0.3.0"
langchain-google-vertexai = "^1.0.8"
fastapi = "^0.109.0"
websockets = "^12.0"
pydantic = "^2.5.3"
python-dotenv = "^1.0.0"
uvicorn = "^0.25.0"
pydantic-settings = "^2.7.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.9"
mypy = "^1.8.0"
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "C4", # flake8-comprehensions
    "RUF", # Ruff-specific rules
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true 