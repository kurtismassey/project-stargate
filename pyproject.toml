[project]
name = "project-stargate-backend"
version = "0.1.0"
description = "Project Stargate AI - Remote Viewing Platform"
authors = [
    { name = "Kurtis Massey", email = "55586356+kurtismassey@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "websockets>=12.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.7.1",
    "langchain>=1.2.7",
    "sqlmodel>=0.0.25",
    "aiosqlite>=0.21.0",
    "langchain-google-genai>=2.1.12",
    "pillow>=10.0.0",
    "tenacity>=8.2.3",
    "pyasn1>=0.6.2",
    "urllib3>=2.6.3",
    "greenlet>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "mypy>=1.8.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.mypy]
plugins = ['pydantic.mypy']
