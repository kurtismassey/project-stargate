[tool.poetry]
name = "project-stargate-backend"
version = "0.1.0"
description = "Project Stargate AI - Remote Viewing Platform"
authors = ["Kurtis Massey <55586356+kurtismassey@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = { extras = ["standard"], version = "^0.118.0" }
websockets = "^12.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.7.1"
langchain = "^1.2.7"
sqlmodel = "^0.0.25"
aiosqlite = "^0.21.0"
langchain-google-genai = "^2.1.12"
pillow = "^10.0.0"
tenacity = "^8.2.3"
pyasn1 = "^0.6.2"
urllib3 = "^2.6.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.9"
mypy = "^1.8.0"
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ['pydantic.mypy']
